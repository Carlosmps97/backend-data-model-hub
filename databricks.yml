# Databricks Asset Bundle — backend (FastAPI) como Databricks App.
# Docs: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/apps-tutorial
# Deploy:  databricks bundle deploy --target prod
# Arranca: databricks bundle run backend --target prod
#
# PARÁMETROS POR ENTORNO = sección `variables:`.
# La config de runtime de la app vive en `config:` (sustituye al viejo
# app.yaml; requiere CLI ≥ 0.283 — el workflow usa setup-cli@main = último).
# Para desplegar en OTRO Databricks (doc 35): NO se edita este archivo — el
# workspace sale de la GitHub Variable DATABRICKS_HOST y cada valor de abajo
# de su GitHub Variable (el workflow las exporta como BUNDLE_VAR_*).
bundle:
  name: bknd-data-model-hub

# NINGUNA variable hay que editar por ambiente: el workflow las exporta como
# `BUNDLE_VAR_<nombre>` desde las GitHub Variables del repo cuando existen, y si
# no existen mandan estos defaults.
variables:
  lakebase_endpoint:
    # GitHub Variable: LAKEBASE_ENDPOINT
    description: "Ruta lógica del endpoint Lakebase — igual en todo workspace que respete la convención de nombres."
    default: projects/dmh-proj/branches/production/endpoints/primary
  lakebase_pgschema:
    # GitHub Variable: LAKEBASE_PGSCHEMA
    description: "Schema PG donde viven las colecciones (tablas id + doc jsonb)."
    default: dmh
  cors_origin_regex:
    # GitHub Variable: CORS_ORIGIN_REGEX
    description: "Regex de orígenes CORS — matchea el front (frnt-data-model-hub) en cualquier workspace."
    default: https://frnt-data-model-hub-.*\.databricksapps\.com
  secret_scope:
    # GitHub Variable: SECRET_SCOPE
    description: "Scope de secretos (Key Vault-backed) que guarda la SECRET_KEY de firma de sesión."
    default: kv-scope-datacraft
  session_secret_key:
    # GitHub Variable: SESSION_SECRET_KEY
    description: "Key del secreto con la SECRET_KEY de firma de sesión (JWT HS256)."
    default: session-secret-key
  app_admin_user:
    # GitHub Variable: APP_ADMIN_USER (opcional).
    # Cuando el deploy lo hace un SERVICE PRINCIPAL (token de CI), `mode:
    # production` le da CAN_MANAGE SOLO a ese SP y el humano que creó la app
    # pierde hasta el botón de Stop. Con esta variable el humano recupera el
    # control en cada deploy.
    # El default es la identidad que despliega: repite el grant que production
    # mode ya hace (el CLI lo deduplica) → sin la variable NO se agrega a nadie
    # extra y el deploy no falla.
    description: "Usuario humano que queda con CAN_MANAGE sobre la app (stop/start/logs desde la UI)."
    default: ${workspace.current_user.userName}

resources:
  apps:
    backend:                      # resource key (lo usa `databricks bundle run backend`)
      name: bknd-data-model-hub   # nombre real de la app en el workspace
      source_code_path: .         # el código de la app está en la raíz del repo
      description: "Data Model Hub — backend de plataforma (FastAPI · Databricks Lakebase Postgres)."
      config:
        # uvicorn recibe UVICORN_HOST=0.0.0.0 y UVICORN_PORT=$DATABRICKS_APP_PORT
        # del runtime de Apps — no hace falta pasar host/puerto.
        command: ['uvicorn', 'app.main:app']
        env:
          - name: LOG_FORMAT
            value: 'json'
          # ── BD principal: Lakebase (doc 28) ──────────────────────────────
          # SIN token, SIN PGUSER y SIN PGHOST a propósito: la app se
          # autentica con su service principal (OAuth M2M inyectado), PGUSER
          # cae al DATABRICKS_CLIENT_ID y el host físico se resuelve solo
          # desde la ruta lógica del endpoint.
          # ONE-TIME por workspace: rol PG del SP + GRANTs (doc 28 §11.3).
          - name: DB_BACKEND
            value: 'lakebase'
          - name: LAKEBASE_ENDPOINT
            value: ${var.lakebase_endpoint}
          - name: LAKEBASE_PGSCHEMA
            value: ${var.lakebase_pgschema}
          # ── CORS por regex: el mismo bundle sirve en cualquier workspace ─
          - name: CORS_ORIGIN_REGEX
            value: ${var.cors_origin_regex}
          # ── Producción: login obligatorio + clave de firma desde el KV ───
          - name: REQUIRE_AUTH
            value: 'true'
          - name: SECRET_KEY
            value_from: session_secret
      resources:
        - name: session_secret
          description: "SECRET_KEY para firmar tokens de sesión."
          secret:
            scope: ${var.secret_scope}
            key: ${var.session_secret_key}
            permission: READ
      permissions:
        - level: CAN_MANAGE       # el humano dueño: stop/start/logs/permissions en la UI
          user_name: ${var.app_admin_user}
        - level: CAN_USE
          group_name: users       # todos los usuarios del workspace pueden abrir la app

targets:
  prod:
    mode: production
    default: true
    workspace:
      # SIN `host:` a propósito (2026-07-27): el workspace destino sale de la
      # variable de entorno DATABRICKS_HOST — o sea de la GitHub Variable del
      # repo, que ya es la que usa el CLI. Un `host:` acá GANA sobre esa
      # variable (verificado), así que hardcodearlo obligaba a editar el repo
      # por cada ambiente y podía desplegar callado al workspace equivocado.
      # En local: exporta DATABRICKS_HOST o usa `databricks -p <perfil> ...`.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
