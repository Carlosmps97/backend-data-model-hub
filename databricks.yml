# Databricks Asset Bundle — backend (FastAPI) como Databricks App.
# Docs: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/apps-tutorial
# Deploy:  databricks bundle deploy --target prod
# Arranca: databricks bundle run backend --target prod
bundle:
  name: bknd-data-model-hub

resources:
  apps:
    backend:                      # resource key (lo usa `databricks bundle run backend`)
      name: bknd-data-model-hub   # nombre real de la app en el workspace
      source_code_path: .         # el código de la app está en la raíz del repo
      description: "Data Model Hub — backend de plataforma (FastAPI · Cosmos DB)."
      resources:
        # Secreto con la connection string de Cosmos. Scope respaldado por Key
        # Vault (kv-scope-datacraft); el secreto vive en KV como `conn-str-cosmos`.
        # Da READ al service principal de la app y se referencia con valueFrom.
        - name: cosmos_secret
          description: "Cosmos connection string (Key Vault-backed scope)."
          secret:
            scope: kv-scope-datacraft
            key: conn-str-cosmos
            permission: READ
      permissions:
        - level: CAN_USE
          group_name: users       # todos los usuarios del workspace pueden abrir la app

targets:
  prod:
    mode: production
    default: true
    workspace:
      host: https://adb-3871428306507680.0.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
