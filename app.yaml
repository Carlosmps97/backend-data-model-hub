# Databricks Apps — runtime del backend (FastAPI).
# Docs: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-apps/app-runtime
#
# uvicorn recibe automáticamente UVICORN_HOST=0.0.0.0 y UVICORN_PORT=$DATABRICKS_APP_PORT
# (Databricks los inyecta para FastAPI/uvicorn), así que no hace falta pasar host/puerto.
command: ['uvicorn', 'app.main:app']

env:
  - name: LOG_FORMAT
    value: 'json'
  # Orígenes CORS = URL de la app frontend.
  - name: CORS_ORIGINS
    value: 'https://frnt-data-model-hub-3871428306507680.0.azure.databricksapps.com'
  # ── BD: Databricks Lakebase Postgres (doc 28) ───────────────────────────
  # Auth SIN secretos: Apps inyecta DATABRICKS_HOST + DATABRICKS_CLIENT_ID/
  # SECRET del service principal de la app; con eso el backend acuña tokens
  # OAuth de BD (~1 h) por conexión nueva del pool. PGUSER tampoco se setea:
  # su default es DATABRICKS_CLIENT_ID (= nombre del rol PG del SP).
  # Requisito ONE-TIME antes del primer deploy: crear el rol PG del SP en el
  # proyecto Lakebase y sus GRANTs sobre el schema `dmh` (doc 28 §11).
  - name: DB_BACKEND
    value: 'lakebase'
  - name: LAKEBASE_ENDPOINT
    value: 'projects/dmh-proj/branches/production/endpoints/primary'
  - name: PGHOST
    value: 'ep-orange-sunset-e1gjz1qx.database.eastus2.azuredatabricks.net'
  - name: PGDATABASE
    value: 'databricks_postgres'
  - name: LAKEBASE_PGSCHEMA
    value: 'dmh'
  # ── Cosmos (fallback limpio): rollback = DB_BACKEND 'cosmos' + redeploy ──
  - name: COSMOS_DATABASE
    value: 'db_modeler'
  # Connection string de Cosmos desde el recurso `cosmos_secret` (declarado en
  # databricks.yml → scope kv-scope-datacraft, key conn-str-cosmos).
  - name: COSMOS_CONNECTION_STRING
    valueFrom: cosmos_secret
  # ── Auth (OBLIGATORIO en prod) ──────────────────────────────────────────
  # Login obligatorio: sin token válido → 401 (sin esto, el header X-Dev-User
  # permitiría suplantar a cualquier usuario, incluido admin).
  - name: REQUIRE_AUTH
    value: 'true'
  # Clave de firma del token de sesión (JWT HS256). Con el default de
  # desarrollo la app NO arranca en prod (assert_secure_config). Secreto en el
  # mismo scope KV que Cosmos, key `session-secret-key`.
  - name: SECRET_KEY
    valueFrom: session_secret
