# App spec de Databricks Apps (backend FastAPI).
#
# NO BORRAR este archivo. Databricks lo lee EN CADA ARRANQUE de la app —
# tanto en el deploy como al apagar/prender desde la UI o en un reinicio del
# runtime. Es la ÚNICA fuente del `command` y las `env` que sobrevive a un
# stop/start.
#
# Historia (para que no se vuelva a borrar): el doc 28 eliminó este app.yaml
# asumiendo que el bloque `config:` de databricks.yml sería la fuente única.
# NO lo es: `databricks bundle deploy` IGNORA en silencio ese `config:` (bug
# abierto databricks/cli #4901, roto v0.283..v0.292 — la versión que instala
# el workflow con setup-cli@main). Resultado: no se generaba ningún app.yaml,
# la app arrancaba SIN variables y al prenderla decía "Failed to load app spec
# / No command to run". Por eso el command+env viven ACÁ y no en `config:`.
#
# Los valores de abajo son los DEFAULTS (los de este workspace). Cada env con
# `value:` se puede sobrescribir por-entorno SIN editar este archivo: el deploy
# workflow (paso "Env del app.yaml desde GitHub Variables") reemplaza el value
# con la GitHub Variable HOMÓNIMA cuando está definida; si no, queda el valor de
# acá. Así otro workspace solo define las Variables que le cambian.
# El binding del secreto `session_secret` (referenciado abajo con valueFrom) y
# los permisos siguen en databricks.yml: esos SÍ los aplica bien el bundle.
#
# uvicorn recibe UVICORN_HOST=0.0.0.0 y UVICORN_PORT=$DATABRICKS_APP_PORT del
# runtime de Apps — no hace falta pasar host/puerto.
command: ["uvicorn", "app.main:app"]

env:
  - name: LOG_FORMAT
    value: "json"

  # ── BD: Databricks Lakebase Postgres (doc 28) ────────────────────────────
  # SIN token, SIN PGUSER y SIN PGHOST a propósito: la app se autentica con su
  # service principal (OAuth M2M inyectado), PGUSER cae al DATABRICKS_CLIENT_ID
  # y el host físico se resuelve solo desde la ruta lógica del endpoint.
  # ONE-TIME por workspace: rol PG del SP + GRANTs (doc 28 §11.3).
  - name: LAKEBASE_ENDPOINT
    value: projects/dmh-proj/branches/production/endpoints/primary
  - name: LAKEBASE_PGSCHEMA
    value: "dmh"

  # ── CORS por regex: el mismo spec sirve en cualquier workspace ────────────
  - name: CORS_ORIGIN_REGEX
    value: https://frnt-data-model-hub-.*\.databricksapps\.com

  # ── Producción: login obligatorio + clave de firma desde el KV ────────────
  - name: REQUIRE_AUTH
    value: "true"
  # valueFrom referencia el recurso `session_secret` que databricks.yml bindea
  # al secreto (scope/key) del Key Vault. El binding lo aplica el bundle; acá
  # solo se inyecta su valor como SECRET_KEY.
  - name: SECRET_KEY
    valueFrom: session_secret
  # Secreto compartido con el server del front (doc 38): autentica el relay de
  # identidad SSO (`x-dmh-sso-*`) en POST /api/auth/sso/login. AMBAS apps leen
  # el MISMO secret del scope (recurso `proxy_secret` en databricks.yml). El
  # secreto se administra A MANO (igual que session-secret-key); el workflow
  # solo VERIFICA que exista antes del deploy (paso "Verificar el secreto del
  # proxy"). Sin él, el login SSO responde 503 y el carril admin sigue vivo.
  - name: PROXY_SHARED_SECRET
    valueFrom: proxy_secret
